[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weather-provider"
version = "0.1.0"
description = "Weather, rain radar and heat stress panels for a 128x32 LED sign driven by sign-server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pillow>=10"]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
weather-provider = "weather_provider.__main__:main"

[tool.setuptools]
packages = ["weather_provider"]

[tool.pytest.ini_options]
pythonpath = ["."]
